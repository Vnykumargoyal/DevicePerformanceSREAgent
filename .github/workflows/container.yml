name: Verify and publish Docker image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install and test
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pytest -q
      - name: Build container
        run: docker build --tag device-sre:ci .
      - name: Start isolated container with synthetic credentials
        run: |
          python - <<'PY'
          from pathlib import Path
          import secrets
          base = Path('runtime-data/ci')
          for directory in ('mst', 'mcp'):
              (base / directory).mkdir(parents=True, mode=0o700)
          (base / 'mst/token').write_text('synthetic-ci-token-never-sent-to-mst')
          token = secrets.token_urlsafe(48)
          (base / 'mcp/token').write_text(token)
          client = base / 'client-token'
          client.write_text(token)
          for path in (base / 'mst/token', base / 'mcp/token', client):
              path.chmod(0o600)
          PY
          sudo chown -R 10001:10001 runtime-data/ci/mst runtime-data/ci/mcp
          docker run --detach --name device-sre-ci --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --publish 127.0.0.1:8765:8765 \
            --mount type=volume,source=device-sre-ci-data,target=/var/lib/device-sre \
            --mount type=bind,source="$PWD/runtime-data/ci/mst",target=/run/secrets/mst,readonly \
            --mount type=bind,source="$PWD/runtime-data/ci/mcp",target=/run/secrets/mcp,readonly \
            --env MST_TOKEN_FILE=/run/secrets/mst/token \
            --env SRE_MCP_TOKEN_FILE=/run/secrets/mcp/token \
            device-sre:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/healthz; then break; fi
            sleep 1
          done
          python deploy/smoke_test.py --token-file runtime-data/ci/client-token
          docker compose config --quiet
      - name: Container logs on failure
        if: failure()
        run: docker logs device-sre-ci
      - name: Stop test container
        if: always()
        run: docker rm --force device-sre-ci || true

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and push to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_ACTOR: ${{ github.actor }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$REGISTRY_ACTOR" --password-stdin
          docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --tag "$image:sha-$GITHUB_SHA" --tag "$image:latest" .
          docker push "$image:sha-$GITHUB_SHA"
          docker push "$image:latest"
          printf 'Published `%s:sha-%s` to GHCR. A running HTTPS endpoint still requires host deployment.\n' \
            "$image" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove registry login
        if: always()
        run: docker logout ghcr.io
